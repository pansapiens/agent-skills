# Victorian (Melbourne) public holidays and government-school holiday periods.
#
# These drive the calendar band across the top of the heatmaps, which explains
# dips that would otherwise look like an outage. They cannot be computed: Easter
# moves, and Victoria declares one-off holidays (AFL Grand Final Friday) whose
# date is only confirmed a few months ahead.
#
# VERIFY before trusting a report that leans on them, and extend as new years are
# gazetted:
#   public holidays  https://business.vic.gov.au/business-information/public-holidays
#   school terms     https://www.education.vic.gov.au/about/department/Pages/datesterm.aspx
#
# Dates are native TOML dates. School holiday spans are inclusive of both ends.

[meta]
state = "VIC"
locality = "Melbourne"
# Years whose dates a human has actually checked against the sources above.
verified_years = []
# Years present in this file, checked or not.
populated_years = [2026]

